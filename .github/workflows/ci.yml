name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run Swift tests
        run: swift test

      - name: Test iCloud provisioning validation
        run: python3 -m unittest discover -s Tests/SigningTests

      - name: Build macOS app bundle
        run: make app

      - name: Build iOS and watchOS apps for the simulator
        run: >-
          xcodebuild
          -project ios/PlanMeterMobile/PlanMeterMobile.xcodeproj
          -scheme PlanMeterMobile
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Archive iOS and watchOS apps for devices
        run: >-
          xcodebuild
          -project ios/PlanMeterMobile/PlanMeterMobile.xcodeproj
          -scheme PlanMeterMobile
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath "$RUNNER_TEMP/PlanMeter.xcarchive"
          CODE_SIGNING_ALLOWED=NO
          archive

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: swift:6.2-noble

    steps:
      - name: Install system libraries
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends libsqlite3-dev python3

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build portable targets
        run: swift build

      - name: Run Swift tests
        run: swift test
